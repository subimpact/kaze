<article class="case-study-wrapper">
  <header class="case-header">
    <div class="container case-header-inner">
      <nav class="breadcrumbs" aria-label="Breadcrumbs">
        <a href="/">Home</a> &rarr;
        <a href="/case-studies">Case studies</a> &rarr;
        <span aria-current="page">{{title}}</span>
      </nav>

      <div class="case-meta-top">
        <span class="client-badge">{{client}}</span>
        <span class="value-badge">{{value}}</span>
      </div>

      <h1 class="case-title">{{title}}</h1>
    </div>
  </header>

  <div class="container case-body-container">
    <div class="case-cards-layout">
      <div class="case-card objective-card">
        <h2 class="card-eyebrow">Objective</h2>
        <p>{{objective}}</p>
      </div>

      <div class="case-card results-card">
        <h2 class="card-eyebrow">Results</h2>
        <ul class="results-list">
          {{results_items}}
        </ul>
      </div>
    </div>

    <div class="back-link-box">
      <a href="/case-studies" class="btn btn-outline">&larr; All case studies</a>
    </div>
  </div>
</article>
