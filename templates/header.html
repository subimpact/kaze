<header class="site-header">
  <div class="container header-inner">
    <a href="/" class="brand-logo" aria-label="{{site_name}} home">
      <span class="logo-hanko">風</span>
      <span class="logo-title">{{site_short_name}}</span>
    </a>

    <nav class="desktop-nav" aria-label="Primary navigation">
      {{nav_links}}
      <a href="/#quickstart" class="btn btn-primary btn-sm">Quickstart</a>
    </nav>

    <button type="button" class="mobile-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </div>

  <div class="mobile-drawer" aria-hidden="true">
    <nav class="mobile-nav-links" aria-label="Mobile navigation">
      {{mobile_nav_links}}
      <a href="/#quickstart" class="btn btn-primary btn-block">Quickstart</a>
    </nav>
  </div>
</header>
