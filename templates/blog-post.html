<article class="article-wrapper">
  <header class="article-header">
    <div class="container article-header-inner">
      <nav class="breadcrumbs" aria-label="Breadcrumbs">
        <a href="/">Home</a> &rarr;
        <a href="/blog">Articles</a> &rarr;
        <span aria-current="page">{{title}}</span>
      </nav>

      <div class="article-tag-strip">
        <span class="category-tag">{{category}}</span>
        <span class="article-read-tag">{{read_min}} min read</span>
      </div>

      <h1 class="article-title">{{title}}</h1>
      <p class="article-lead">{{excerpt}}</p>

      <div class="article-meta">
        <span class="meta-item author">By <strong>{{author}}</strong></span>
        <span class="meta-separator">/</span>
        <span class="meta-item date"><time datetime="{{date}}">{{date_formatted}}</time></span>
      </div>
    </div>
  </header>

  <div class="container article-body-container">
    <div class="article-body">
      {{body_html}}
    </div>

    {{faq_section}}

    <div class="back-link-box">
      <a href="/blog" class="btn btn-outline">&larr; All articles</a>
    </div>
  </div>
</article>
